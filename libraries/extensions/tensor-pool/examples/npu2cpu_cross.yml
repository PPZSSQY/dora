# NPU-to-CPU cross-machine throughput test (Ascend analog of cuda2cpu_cross.yml).
# Sender (NPU) on machine A, receiver (CPU) on machine B.
# Payload is D2H into A's /dev/shm, then the existing CPU mirror/TCP path.
# Absolute working_dir: cross-machine spawn does not use the repo root.
nodes:
  - id: sender_node
    deploy:
      machine: A
      working_dir: /workspace/tensorpool-ascend/dora/libraries/extensions/tensor-pool/examples
    path: sender.py
    inputs:
      next_require: receiver_node/next_require
    outputs:
      - data
    env:
      cross_machine: "B"
      sender_device: npu:0
      receiver_device: cpu
      message_num: 10

  - id: receiver_node
    deploy:
      machine: B
      working_dir: /home/aphrora/workspace/tensorpool-ascend/dora/libraries/extensions/tensor-pool/examples
    build: pip install torch --extra-index-url https://download.pytorch.org/whl/cpu numpy tqdm
    path: receiver.py
    inputs:
      data: sender_node/data
    outputs:
      - next_require
    env:
      sender_device: npu:0
      receiver_device: cpu
      message_num: 10
