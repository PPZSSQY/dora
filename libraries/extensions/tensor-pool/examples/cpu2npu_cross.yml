# CPU-to-NPU cross-machine throughput test (Ascend analog of cpu2cuda_cross.yml).
# Sender (CPU) on machine A, receiver (NPU) on machine B.
# Payload travels A host → TCP/zenoh → B host mirror → H2D on B.
# Cross-machine spawn uses daemon_cwd/_work/<session>/, not the repo root.
# Relative working_dir therefore misses receiver.py on B (no build copies it).
# Absolute paths are the supported remote-node convention.
nodes:
  - id: sender_node
    deploy:
      machine: A
      working_dir: /home/aphrora/workspace/tensorpool-ascend/dora/libraries/extensions/tensor-pool/examples
    build: pip install torch --extra-index-url https://download.pytorch.org/whl/cpu numpy
    path: sender.py
    inputs:
      next_require: receiver_node/next_require
    outputs:
      - data
    env:
      cross_machine: "B"
      sender_device: cpu
      receiver_device: npu:0
      message_num: 10

  - id: receiver_node
    deploy:
      machine: B
      working_dir: /workspace/tensorpool-ascend/dora/libraries/extensions/tensor-pool/examples
    path: receiver.py
    inputs:
      data: sender_node/data
    outputs:
      - next_require
    env:
      sender_device: cpu
      receiver_device: npu:0
      message_num: 10
