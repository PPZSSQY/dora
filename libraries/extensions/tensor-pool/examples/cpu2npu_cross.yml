# CPU-to-NPU cross-machine throughput test (Ascend analog of cpu2cuda_cross.yml).
# Sender (CPU) on machine A, receiver (NPU) on machine B.
# Payload travels A host → TCP/zenoh → B host mirror → H2D on B.
nodes:
  - id: sender_node
    deploy:
      machine: A
      working_dir: libraries/extensions/tensor-pool/examples  # relative to the daemon's cwd (repo root), per the multiple-daemons convention
    build: pip install torch --extra-index-url https://download.pytorch.org/whl/cpu numpy
    path: sender.py
    inputs:
      next_require: receiver_node/next_require
    outputs:
      - data
    env:
      cross_machine: "B"
      sender_device: cpu
      receiver_device: npu:0
      message_num: 100

  - id: receiver_node
    deploy:
      machine: B
      working_dir: libraries/extensions/tensor-pool/examples  # relative to the daemon's cwd (repo root), per the multiple-daemons convention
    path: receiver.py
    inputs:
      data: sender_node/data
    outputs:
      - next_require
    env:
      sender_device: cpu
      receiver_device: npu:0
      message_num: 100
